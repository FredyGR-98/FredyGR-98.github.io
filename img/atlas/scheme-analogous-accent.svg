  <title id="title">Esquema análogo con acento</title>
  <desc id="desc">Combinación análoga con un color de acento para dirigir la mirada.</desc>
  <rect width="560" height="390" rx="24" fill="#fffdf8"/>
  <text x="34" y="48" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="24" font-weight="700" fill="#201a16">Análogo con acento</text>
  <g transform="translate(160 206)">
    <path d="M0,0 L0,-112 A112,112 0 0,1 56,-97 Z" fill="#ff3b1f"/><path d="M0,0 L56,-97 A112,112 0 0,1 97,-56 Z" fill="#ff6a14"/><path d="M0,0 L97,-56 A112,112 0 0,1 112,0 Z" fill="#ffae1f"/><path d="M0,0 L112,0 A112,112 0 0,1 97,56 Z" fill="#ffd21a"/><path d="M0,0 L97,56 A112,112 0 0,1 56,97 Z" fill="#ffe91f"/><path d="M0,0 L56,97 A112,112 0 0,1 0,112 Z" fill="#8bd700"/><path d="M0,0 L0,112 A112,112 0 0,1 -56,97 Z" fill="#00c941"/><path d="M0,0 L-56,97 A112,112 0 0,1 -97,56 Z" fill="#11b7c8"/><path d="M0,0 L-97,56 A112,112 0 0,1 -112,0 Z" fill="#1974c8"/><path d="M0,0 L-112,0 A112,112 0 0,1 -97,-56 Z" fill="#3b48bb"/><path d="M0,0 L-97,-56 A112,112 0 0,1 -56,-97 Z" fill="#7b2bc1"/><path d="M0,0 L-56,-97 A112,112 0 0,1 0,-112 Z" fill="#c92b8c"/>
